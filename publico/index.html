<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GanaHoy</title>
  <meta name="description" content="Mira los números disponibles y separa el tuyo.">
  <meta name="theme-color" content="#d4f0df">
  <meta name="color-scheme" content="light only">
  <link rel="icon" href="/icono.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="barra">
    <a href="/" class="marca" aria-label="GanaHoy, inicio">
      <img src="/icono.png" alt="" width="42" height="42">
      <div>Gana<span>Hoy</span></div>
    </a>
  </header>

  <main id="app" class="contenido">
    <p class="cargando">Cargando…</p>
  </main>

  <!-- Barra fija con los números elegidos -->
  <div id="carrito" class="carrito" hidden>
    <div class="carrito-info">
      <strong id="carrito-cuenta">0 números</strong>
      <span id="carrito-total"></span>
    </div>
    <button id="carrito-limpiar" class="boton boton-suave" type="button">Quitar</button>
    <button id="carrito-separar" class="boton" type="button">Separar</button>
  </div>

  <!-- Formulario para separar -->
  <dialog id="formulario" class="ventana">
    <form id="form-separar" method="dialog" novalidate>
      <h2>Separar números</h2>
      <p class="elegidos" id="form-elegidos"></p>
      <label>Nombre completo
        <input name="nombre" autocomplete="name" required minlength="2" maxlength="80">
      </label>
      <label>WhatsApp
        <input name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" required placeholder="300 123 4567">
      </label>
      <label>Ciudad
        <input name="ciudad" autocomplete="address-level2" required minlength="2" maxlength="60">
      </label>
      <p class="error" id="form-error" hidden></p>
      <div class="acciones">
        <button type="button" class="boton boton-suave" id="form-cancelar">Cancelar</button>
        <button type="submit" class="boton" id="form-enviar">Separar</button>
      </div>
    </form>
  </dialog>

  <!-- Confirmación -->
  <dialog id="listo" class="ventana">
    <div class="listo">
      <div class="listo-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </div>
      <h2>¡Perfecto! Tus números quedaron separados</h2>
      <p id="listo-detalle"></p>
      <div class="listo-numeros" id="listo-numeros"></div>
      <p class="listo-total" id="listo-total"></p>

      <div class="pago">
        <p class="pago-titulo">Datos de pago</p>
        <div class="pago-fila">
          <div><small>Nequi</small><strong data-pago="nequi"></strong></div>
          <button type="button" class="copiar" data-copiar="nequi">Copiar</button>
        </div>
        <div class="pago-fila">
          <div><small>Llave Bre-B</small><strong data-pago="llave"></strong></div>
          <button type="button" class="copiar" data-copiar="llave">Copiar</button>
        </div>
      </div>

      <p class="metodo-titulo">¿Cómo pagaste?</p>
      <div class="metodos" role="radiogroup" aria-label="Método de pago">
        <button type="button" class="metodo" role="radio" aria-checked="false" data-metodo="Nequi">Nequi</button>
        <button type="button" class="metodo" role="radio" aria-checked="false" data-metodo="Llave Bre-B">Llave Bre-B</button>
      </div>

      <p class="nota">Paga y envía tu comprobante por WhatsApp. Tus números quedan separados hasta confirmar el pago.</p>
      <a class="boton boton-whatsapp" id="listo-whatsapp" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
        Enviar comprobante
      </a>
      <button type="button" class="enlace-cerrar" id="listo-cerrar">Volver a los números</button>
    </div>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
